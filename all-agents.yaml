    - For existing RAW_INPUT_REF_V1, return `handoff_status: requires_parent_dispatch`, `workflow_complete: false`, `next_action: {type: new_task, tool: new_task, mode: gpt-oss-intake-analyzer}`, and Recommended Next Mode: gpt-oss-intake-analyzer only when `routing_control.completion_unwind.return_to_mode` is present; otherwise return a blocker recommending runtime repair or re-materialization.
    - Use artifact paths as source of truth and do not reject large input solely because it is large.
    - Do not synthesize missing routing_control; require the parent/runtime to repair it so completion can unwind to user-response-composer.
