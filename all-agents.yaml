    - After an `attempt_completion` failure caused by incomplete todos outside `assigned_task_only` scope, do not retry `attempt_completion`. If `budgets.retry_budget` is `0`, do not retry tool actions. If no permitted output channel remains, stop further tool actions; the already prepared result text is the Partial Handoff.
