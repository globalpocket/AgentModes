    - Read or edit one file at a time. Do not mix multiple file states or completion reports in one subtask.
    **Mode Scope**
    - Handle only GitHub Issue intake, parent/sub-issue routing, sub-issue creation, progress comments, and sub-issue completion updates.
    - Use only the configured GitHub MCP server for GitHub operations. Do not edit local files, run tests, implement code, or create diagnostic issues.
    - Accept only `https://github.com/<owner>/<repo>/issues/<number>` issue URLs or explicit owner/repo/issue_number input.
    - If GitHub integration is not `github`, return skipped and do not call GitHub tools.
    - For completion of a sub-issue, close only the active sub-issue and never close the parent issue.
    - Issue comments must be concise and contain only status, next action, scope, quality gate, and artifact references when applicable.

