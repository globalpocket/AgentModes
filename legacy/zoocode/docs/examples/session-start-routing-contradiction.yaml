# Regression fixture: SESSION_START_V1 must fail fast on contradictory routing.
# Expected behavior: Orchestrator reports ROUTING_CONTROL_CONTRADICTION and makes no /init call.
SESSION_START_V1:
  run_id: rust-runtime-session-start-routing-contradiction
  raw_request_path: artifacts/intake/rust-runtime-session-start-routing-contradiction/raw-request.md
  raw_manifest_path: artifacts/intake/rust-runtime-session-start-routing-contradiction/raw-request.manifest.json
  user_needs_path: artifacts/intake/rust-runtime-session-start-routing-contradiction/user-needs.yaml
  state_path: artifacts/state/rust-runtime-session-start-routing-contradiction.json
  next_action:
    type: new_task
    tool: new_task
    mode: verified-integrator
  assigned_mode: verified-integrator
  goal: Fix Rust runtime SESSION_START routing without generating AGENTS.md.
  routing_control:
    allowed_next_modes:
      - orchestrator
    forbidden_next_modes:
      - verified-integrator
      - code
      - tester
      - test-writer
      - refactorer
      - patch-applier
      - new-file-writer
expected_behavior:
  status: ROUTING_CONTROL_CONTRADICTION
  reason: assigned_mode verified-integrator is forbidden by routing_control.forbidden_next_modes and absent from allowed_next_modes.
  forbidden_tool_calls:
    - tool: run_slash_command
      command: init
